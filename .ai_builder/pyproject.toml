[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-builder"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk",
    "python-dotenv",
    "openinference-instrumentation-claude-agent-sdk",
    "arize-phoenix-otel",
]

[project.scripts]
ai-build = "ai_builder_cli:cli"
entire-agent-ai-builder = "bin.entire_agent_ai_builder:main"

[tool.setuptools]
py-modules = ["ai_builder_cli", "run", "config"]
packages = ["src", "bin"]
